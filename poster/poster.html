<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Don't change the Château — Château de Fontainebleau, INSEAD Group 11</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Mulish:wght@0,400;0,600;0,800&display=swap">
<style>
/* A1 portrait, 594 × 841 mm, read standing up in about thirty seconds.
   Reading path: problem → insight → the journey → three initiatives → feasibility → 90 days.
   The cover treatment is sampled from page 1 of the booklet: navy #1E2A6B through plum
   #52395A into a warm amber glow #8A6038, in a gold hairline frame.
   One colour per initiative, used in the journey, the cards and the timeline:
   01 flame, 02 royal, 03 green. Nothing on the sheet is smaller than 15pt. */
@page{ size:594mm 841mm; margin:0 }
:root{
  --paper:#FDF4E5; --card:#FFFFFF; --ink:#2A2340; --mute:#574C68;
  --gold:#F5B700; --navy:#1E2A6B; --navy-d:#141C4A; --plum:#52395A;
  --a:#B23E10; --b:#2B5BD7; --c:#2F7A34;          /* 01, 02, 03 */
  --hair:#E7D9BC; --amber:#FFF0C9; --amber-ink:#6B4E00;
  --disp:"Jost","Futura",sans-serif; --body:"Mulish","Avenir Next",sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-print-color-adjust:exact; print-color-adjust:exact}
html,body{width:594mm; height:841mm}
body{background:var(--paper); color:var(--ink); font-family:var(--body);
  display:flex; flex-direction:column; overflow:hidden}
h1,h2,h3,h4{font-family:var(--disp); font-weight:700; line-height:1.04}
.sect{font-family:var(--disp); font-weight:700; font-size:16pt; letter-spacing:.2em;
  text-transform:uppercase; color:var(--mute)}

/* ── the cover ── */
.head{position:relative; flex:0 0 auto; padding:11mm 98mm 9mm 18mm; color:#fff; overflow:hidden;
  background:
    radial-gradient(ellipse 58% 88% at 48% 120%, rgba(190,128,58,.9), rgba(120,76,58,.4) 46%, transparent 74%),
    linear-gradient(176deg,#1E2A6B 0%,#232B69 34%,#3B3161 66%,#52395A 100%)}
.head::before{content:""; position:absolute; inset:6mm; border:.7mm solid var(--gold);
  border-radius:5mm; pointer-events:none}
.eyebrow{font-family:var(--disp); font-weight:700; font-size:16pt; letter-spacing:.2em;
  text-transform:uppercase; color:var(--gold)}
h1{font-size:55pt; margin-top:6mm; letter-spacing:-.02em; white-space:pre-line}
h1 em{font-style:normal; color:var(--gold)}
.head .sub{margin-top:7mm; font-size:22pt; line-height:1.3; color:rgba(255,255,255,.93); max-width:60ch}
.flamme{position:absolute; right:14mm; bottom:10mm; height:92mm; width:auto;
  filter:drop-shadow(0 8mm 12mm rgba(0,0,0,.42))}

/* ── the argument: one barrier per audience, before any solution ── */
.bar{flex:0 0 auto; padding:6mm 18mm 0}
.bar h2{font-size:34pt; margin-top:2mm}
.brows{display:grid; gap:0; margin-top:6mm}
.br{display:grid; grid-template-columns:62mm minmax(0,1fr) 74mm; gap:9mm; align-items:center;
  padding:3mm 0; border-top:.5mm solid var(--hair)}
.br:last-child{border-bottom:.5mm solid var(--hair)}
.br .who{font-family:var(--disp); font-weight:700; font-size:25pt; line-height:1.08; color:var(--a)}
.br.b .who{color:var(--b)} .br.c .who{color:var(--c)}
.br .say{font-size:22pt; line-height:1.24; color:var(--mute); font-style:italic}
.br .fix{font-family:var(--disp); font-weight:700; font-size:23pt; line-height:1.12;
  text-align:right}
.bar .note{margin-top:5mm; font-size:18pt; line-height:1.3; color:var(--mute); max-width:120ch}

/* ── three initiatives ── */
.ini{flex:0 0 auto; padding:7mm 18mm 0; display:flex; flex-direction:column}
.icards{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7mm; margin-top:5mm;
  align-items:stretch}
.ic{background:var(--card); border-radius:4mm; padding:6mm 6mm; border-top:2.4mm solid var(--a);
  display:flex; flex-direction:column; gap:3mm}
.ic.b{border-top-color:var(--b)} .ic.c{border-top-color:var(--c)}
.ic .n{font-family:var(--disp); font-weight:700; font-size:20pt; color:var(--a)}
.ic .seg{font-family:var(--disp); font-weight:700; font-size:14.5pt; letter-spacing:.12em;
  text-transform:uppercase; color:var(--mute); margin-top:-1.5mm}
/* the mechanism, as a chain — the same shape for all three so they read as parallel */
.chain{display:flex; flex-wrap:wrap; gap:2mm 0; align-items:center; margin-top:1mm}
.chain i{font-style:normal; font-family:var(--disp); font-weight:700; font-size:14.5pt;
  background:var(--amber); color:var(--amber-ink); border-radius:99mm; padding:1.6mm 3.4mm}
.chain s{text-decoration:none; color:var(--hair); font-weight:700; padding:0 1.2mm}
.ic.b .n{color:var(--b)} .ic.c .n{color:var(--c)}
.ic h3{font-size:24pt; line-height:1.1}
.ic p{font-size:17pt; line-height:1.26; color:var(--mute)}
.ic .fig{margin-top:auto; padding-top:3.5mm; border-top:.4mm solid var(--hair);
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:4mm}
.ic .fig .k{font-family:var(--disp); font-weight:700; font-size:14pt; letter-spacing:.1em;
  text-transform:uppercase; color:var(--mute); display:block; line-height:1.14}
.ic .fig .v{font-family:var(--disp); font-weight:700; font-size:26pt; line-height:1; margin-top:1.4mm}
.ic .fig .v.rev{color:var(--a)}
.ic.b .fig .v.rev{color:var(--b)} .ic.c .fig .v.rev{color:var(--c)}
.ic .kpi{margin-top:3mm; font-size:15pt; line-height:1.2; color:var(--mute)}
.ic .kpi b{font-family:var(--disp); font-weight:700; display:block; font-size:14pt;
  letter-spacing:.1em; text-transform:uppercase; color:var(--ink)}

/* ── where it happens, and what it physically is ──
   The estate carries the three pins; the two photographs sit beside it at a quarter of
   the width, because they are evidence, not the argument. */
.estate{flex:1 1 auto; min-height:0; background:var(--navy-d); color:#fff;
  padding:7mm 18mm 7mm; display:flex; flex-direction:column; margin-top:9mm}
.estate .sect{color:var(--gold)}
/* the map on top, the group's own renders across the full width beneath it — small
   thumbnails made the work impossible to read, which defeated showing it at all */
.ewrap{display:flex; flex-direction:column; gap:6mm; margin-top:4mm; flex:1 1 auto; min-height:0}
.emap{flex:1 1 auto; min-height:74mm}
figure#fig{position:relative; border-radius:4mm; overflow:hidden; background:#9FC0DC;
  width:100%; height:100%}
figure#fig > img{display:block; width:100%; height:100%; object-fit:cover}
#leads{position:absolute; inset:0; width:100%; height:100%}
/* the trail: a dashed gold route through the thirteen stops, then the bonus */
#leads .route{fill:none; stroke:var(--gold); stroke-width:1.6; stroke-dasharray:3.4 3.2;
  stroke-linecap:round; stroke-linejoin:round; opacity:.95}
#leads .route.bonus{stroke-dasharray:1.6 3.2; opacity:.7}
#leads .mk{fill:#fff; stroke:var(--a); stroke-width:1.6}
#leads .mk.bonus{fill:var(--gold); stroke:#fff}
#leads text{fill:var(--a); font-family:var(--disp); font-weight:700; font-size:6.4px;
  text-anchor:middle; dominant-baseline:central}
#leads text.bonus{fill:var(--ink)}
.tag{position:absolute; transform:translate(-50%,-50%); background:#fff; border-radius:3mm;
  padding:1.8mm 3.4mm; font-family:var(--disp); font-weight:700; font-size:15pt;
  line-height:1.1; white-space:nowrap; color:var(--ink)}
.tag i{font-style:normal; color:var(--a); margin-right:2mm}
.eshots{flex:0 0 auto; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7mm}
.eshots figure{border-radius:4mm; overflow:hidden; background:var(--navy);
  display:flex; flex-direction:column; min-height:0}
.eshots img{display:block; width:100%; height:36mm; object-fit:cover; flex:0 0 auto}
.eshots figcaption{flex:0 0 auto; padding:2.2mm 4mm; font-size:14pt; line-height:1.18;
  color:rgba(255,255,255,.88)}
.eshots figcaption b{font-family:var(--disp); font-weight:700; font-size:13.5pt;
  letter-spacing:.12em; text-transform:uppercase; color:var(--gold); display:block;
  margin-bottom:1.2mm}
.enote{flex:0 0 auto; margin-top:4mm; font-size:16pt; line-height:1.26;
  color:rgba(255,255,255,.8)}

/* ── feasibility ── */
.feas{flex:0 0 auto; margin-top:6mm; background:var(--gold); color:#4A3600; padding:5mm 18mm}
.feas .sect{color:#7A5500}
.fgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9mm; margin-top:4mm}
.fg .v{font-family:var(--disp); font-weight:700; font-size:42pt; line-height:1}
.fg .t{font-size:17pt; line-height:1.24; margin-top:2mm}
.feas .obj{margin-top:5mm; padding-top:4mm; border-top:.8mm solid rgba(74,54,0,.3);
  font-family:var(--disp); font-weight:700; font-size:19pt; line-height:1.26}

/* ── ninety days ── */
.plan90{flex:0 0 auto; padding:6mm 18mm 0}
.pgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7mm; margin-top:5mm}
.ph{border-top:2.4mm solid var(--a); padding-top:3.5mm}
.ph:nth-child(2){border-top-color:var(--b)} .ph:nth-child(3){border-top-color:var(--c)}
.ph .s{font-family:var(--disp); font-weight:700; font-size:16pt; letter-spacing:.14em;
  text-transform:uppercase; color:var(--mute)}
.ph h3{font-size:25pt; margin-top:1.2mm}
.ph p{font-size:17pt; line-height:1.26; color:var(--mute); margin-top:2mm}
.dec{margin-top:5mm; font-family:var(--disp); font-weight:700; font-size:22pt; color:var(--a)}

/* ── foot ── */
.foot{flex:0 0 auto; padding:6mm 18mm 7mm; display:flex; gap:10mm; align-items:flex-end;
  justify-content:space-between}
.rules{display:flex; gap:4mm; flex-wrap:wrap}
.rules span{background:var(--navy); color:#fff; border-radius:99mm; padding:2.4mm 6mm;
  font-family:var(--disp); font-weight:700; font-size:17pt}
.foot .src{margin-top:4mm; font-size:15pt; line-height:1.3; color:var(--mute); max-width:118mm}
.foot .dis{margin-top:2.5mm; font-size:15pt; color:var(--mute); max-width:118mm}
/* the QR is the route to everything the sheet had to leave out, so it is sized to be
   seen from across the room, not found by someone already leaning in */
.qr{flex:0 0 auto; display:flex; gap:6mm; align-items:center; background:var(--navy);
  border-radius:5mm; padding:5mm 7mm 5mm 5mm}
.qr .box{width:60mm; height:60mm; background:#fff; border-radius:3mm; padding:2.5mm;
  display:grid; place-items:center}
.qr .box svg{width:100%; height:100%; shape-rendering:crispEdges}
.qr .t{font-family:var(--disp); font-weight:700; font-size:25pt; line-height:1.14;
  max-width:62mm; color:#fff}
.qr .u{font-size:16pt; color:var(--gold); margin-top:2.5mm; max-width:62mm}
</style>
</head>
<body>

<header class="head">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="line"></h1>
  <p class="sub" id="sub"></p>
  <img class="flamme" src="flamme.png" alt="Flamme, the crowned salamander of François I">
</header>

<section class="bar">
  <div class="sect" id="barT"></div>
  <h2>Three different barriers stop Fontainebleau turning its heritage into engagement</h2>
  <div class="brows" id="barRows"></div>
  <p class="note" id="barNote"></p>
</section>

<section class="ini">
  <div class="sect" id="iT"></div>
  <div class="icards" id="iCards"></div>
</section>

<section class="estate">
  <div class="sect" id="eT"></div>
  <div class="ewrap">
    <div class="emap"><figure id="fig">
      <img id="map" src="poster-map.png" alt="The estate, with the three recommendations marked">
      <svg id="leads" viewBox="0 0 558 330" preserveAspectRatio="none" aria-hidden="true"></svg>
    </figure></div>
    <div class="eshots" id="eShots"></div>
  </div>
  <p class="enote" id="eNote"></p>
</section>

<section class="feas">
  <div class="sect" id="fT"></div>
  <div class="fgrid" id="fGrid"></div>
  <div class="obj" id="fObj"></div>
</section>

<section class="plan90">
  <div class="sect">Ninety days</div>
  <div class="pgrid" id="pGrid"></div>
  <div class="dec" id="pDec"></div>
</section>

<footer class="foot">
  <div>
    <div class="rules" id="rules"></div>
    <div class="src" id="srcLine"></div>
    <div class="dis">A student marketing proposal prepared for a course. Not affiliated with,
      commissioned by or endorsed by the Château de Fontainebleau.</div>
  </div>
  <div class="qr">
    <div class="box" id="qr"></div>
    <div><div class="t" id="ctaT"></div><div class="u" id="url"></div></div>
  </div>
</footer>

<script src="plan.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
var SITE = (new URLSearchParams(location.search)).get('url')
        || 'https://edav8.github.io/G11-Poster/';
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function T(id,v){ document.getElementById(id).textContent = v; }

T('eyebrow', BOARD.eyebrow); T('sub', BOARD.sub);
document.getElementById('line').innerHTML =
  'Fontainebleau already has the content.\n<em>We change how three audiences reach it.</em>';

T('barT', BOARD.barriers.t); T('barNote', BOARD.barriers.note);
document.getElementById('barRows').innerHTML = BOARD.barriers.rows.map(function(b){
  return '<div class="br '+esc(b.c)+'"><div class="who">'+esc(b.who)+'</div>'+
    '<div class="say">'+esc(b.say)+'</div><div class="fix">'+esc(b.fix)+'</div></div>'; }).join('');

T('iT', BOARD.inits.t);
document.getElementById('iCards').innerHTML = BOARD.inits.rows.map(function(r){
  var chain = '<div class="chain">' + r.chain.map(function(c,i){
    return (i ? '<s>\u203a</s>' : '') + '<i>'+esc(c)+'</i>'; }).join('') + '</div>';
  return '<article class="ic '+esc(r.c)+'"><div class="n">'+esc(r.n)+'</div>'+
    '<div class="seg">'+esc(r.seg)+'</div>'+
    '<h3>'+esc(r.k)+'</h3><p>'+esc(r.p)+'</p>'+ chain +
    '<div class="fig">'+
      '<div><span class="k">'+esc(BOARD.inits.costLabel)+'</span>'+
        '<div class="v">'+esc(r.cost)+'</div></div>'+
      '<div><span class="k">'+esc(BOARD.inits.revLabel)+'</span>'+
        '<div class="v rev">'+esc(r.rev)+'</div></div>'+
    '</div>'+
    '<div class="kpi"><b>'+esc(BOARD.inits.kpiLabel)+'</b>'+esc(r.kpi)+'</div></article>'; }).join('');

T('eT', BOARD.estate.t); T('eNote', BOARD.estate.note);
/* the group's own renders: one per recommendation, plus the retail horizon */
document.getElementById('eShots').innerHTML =
  [STATION_SHOT, TIMELINE_SHOT, MERCH_SHOT].map(function(f){
    return '<figure><img src="'+f.src+'" alt="'+esc(f.alt)+'">'+
      '<figcaption><b>'+esc(f.cap)+'</b>'+esc(f.note)+'</figcaption></figure>'; }).join('');

/* The map shows the TRAIL: fourteen stops projected through the same camera the estate
   was rendered with, joined by a dashed route in order. Positions are schematic \u2014 the
   model is a reconstruction, not a survey \u2014 but the rooms and their rough relation are
   real: the Salle de Bal overlooks the Cour Ovale, the horseshoe staircase is on the
   Cour du Cheval Blanc. */
(async function(){
  var svg = document.getElementById('leads');
  var MM_W = 558, MM_H = 330;
  var fig = document.getElementById('fig');
  var box = fig.getBoundingClientRect();
  MM_H = box.height / (box.width / MM_W);
  svg.setAttribute('viewBox', '0 0 ' + MM_W + ' ' + MM_H.toFixed(1));

  var stops = [];
  try { stops = await (await fetch('poster-stops.json', {cache:'no-store'})).json(); } catch(e) {}
  if (!stops.length) { window.__posterReady = true; return; }

  var pt = stops.map(function(st){
    return { n: st.n, bonus: st.bonus, x: st.x * MM_W, y: st.y * MM_H };
  });
  var main = pt.filter(function(p){ return !p.bonus; });
  var bonus = pt.filter(function(p){ return p.bonus; });

  function path(list){
    return list.map(function(p,i){
      return (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1); }).join(' ');
  }
  var out = '<path class="route" d="' + path(main) + '"/>';
  if (bonus.length && main.length){
    out += '<path class="route bonus" d="' +
      path([main[main.length-1], bonus[0]]) + '"/>';
  }
  pt.forEach(function(p){
    out += '<circle class="mk' + (p.bonus ? ' bonus' : '') + '" cx="' + p.x.toFixed(1) +
           '" cy="' + p.y.toFixed(1) + '" r="4.4"/>';
    out += '<text class="' + (p.bonus ? 'bonus' : '') + '" x="' + p.x.toFixed(1) +
           '" y="' + p.y.toFixed(1) + '">' + esc(String(p.n)) + '</text>';
  });
  svg.innerHTML = out;
})();

T('fT', BOARD.feas.t); T('fObj', BOARD.feas.objective);
document.getElementById('fGrid').innerHTML =
  '<div class="fg"><div class="v">'+esc(BOARD.feas.cost)+'</div><div class="t">'+esc(BOARD.feas.costOf)+'</div></div>'+
  '<div class="fg"><div class="v">'+esc(BOARD.feas.share)+'</div><div class="t">'+esc(BOARD.feas.shareOf)+'</div></div>'+
  '<div class="fg"><div class="v">'+esc(BOARD.feas.days)+'</div><div class="t">'+esc(BOARD.feas.daysOf)+'</div></div>';

document.getElementById('pGrid').innerHTML = BOARD.phases.map(function(p){
  return '<div class="ph"><div class="s">'+esc(p.s)+'</div><h3>'+esc(p.k)+'</h3>'+
    '<p>'+esc(p.p)+'</p></div>'; }).join('');
T('pDec', BOARD.decision);

document.getElementById('rules').innerHTML = BOARD.rules.map(function(r){
  return '<span>'+esc(r)+'</span>'; }).join('');
T('srcLine', BOARD.sources);
T('ctaT', BOARD.cta);
document.getElementById('url').textContent = SITE.replace(/^https?:\/\//,'');
try{
  var q = qrcode(0,'M'); q.addData(SITE); q.make();
  document.getElementById('qr').innerHTML = q.createSvgTag({cellSize:4, margin:0});
  var sv = document.querySelector('#qr svg');
  if (sv){ sv.setAttribute('width','100%'); sv.setAttribute('height','100%'); }
}catch(e){ document.getElementById('qr').innerHTML='<div style="font:700 12pt sans-serif">QR offline</div>'; }
window.__posterReady = true;
</script>
</body>
</html>
